/* ================= progress model ================= */
function emptyProg(){return {xp:0,days:[],results:{},stats:{types:{},dia:0}};}
function normProg(p){p=p||{};return {xp:p.xp||0,days:(p.days||[]).slice(),results:JSON.parse(JSON.stringify(p.results||{})),stats:{types:JSON.parse(JSON.stringify((p.stats&&p.stats.types)||{})),dia:(p.stats&&p.stats.dia)||0},updatedAt:p.updatedAt||0};}
function mergeProg(a,b){
  var out={xp:Math.max(a.xp,b.xp),days:Array.from(new Set(a.days.concat(b.days))).sort().slice(-90),results:{},stats:{types:{},dia:Math.max(a.stats.dia,b.stats.dia)}};
  new Set(Object.keys(a.results).concat(Object.keys(b.results))).forEach(function(k){var x=a.results[k],y=b.results[k];if(!x||!y){out.results[k]=Object.assign({},x||y);return;}
    var nw=(x.at||0)>(y.at||0)?x:y;out.results[k]={best:Math.max(x.best,y.best),last:nw.last,tries:Math.max(x.tries,y.tries),at:nw.at};});
  new Set(Object.keys(a.stats.types).concat(Object.keys(b.stats.types))).forEach(function(k){var x=a.stats.types[k]||{c:0,n:0},y=b.stats.types[k]||{c:0,n:0};out.stats.types[k]=x.n>=y.n?x:y;});
  return out;
}
function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ================= backends ================= */
function E(code){var e=new Error(code);e.code=code;return e;}
function ClaudeAPI(){
  var db=null;
  function studentFrom(h){return db.doc("logins/"+h).get().then(function(snap){if(!snap.exists)throw E("bad");var d=snap.data();
    return db.doc("progress/"+d.account).get().then(function(ps){return {role:"student",hash:h,id:d.account,name:d.name||"",unlocked:(d.unlocked&&d.unlocked.length?d.unlocked.slice():[1]),progress:ps.exists?normProg(ps.data()):null};});});}
  function teacherFrom(h,login){return db.doc("config/teacher").get().then(function(snap){if(!snap.exists||snap.data().hash!==h)throw E("bad");return {role:"teacher",hash:h,login:login||snap.data().login};});}
  return {
    name:"claude",
    ready:function(){return window.claude.use("db").then(function(d){db=d||null;return !!db;}).catch(function(){return false;});},
    login:function(role,login,pass){if(!db)return Promise.reject(E("offline"));return credHash(login,pass).then(function(h){return role==="teacher"?teacherFrom(h,login.toLowerCase()):studentFrom(h);});},
    restore:function(s){if(!db)return Promise.resolve(null);return (s.role==="teacher"?teacherFrom(s.hash,s.login):studentFrom(s.hash)).catch(function(e){if(e.code==="bad")return null;throw e;});},
    sessionOf:function(r){return {role:r.role,hash:r.hash,id:r.id,name:r.name,login:r.login};},
    saveProgress:function(s,data){return db.doc("progress/"+s.id).set({xp:data.xp,days:data.days,results:data.results,stats:data.stats,updatedAt:Date.now()});},
    teacherLoad:function(){return Promise.all([db.collection("accounts").limit(1000).get(),db.collection("progress").limit(1000).get()]).then(function(r){
      var accounts=r[0].docs.map(function(d){var x=JSON.parse(JSON.stringify(d.data()));x.id=d.id;if(!x.unlocked||!x.unlocked.length)x.unlocked=[1];return x;});
      var progress={};r[1].docs.forEach(function(d){progress[d.id]=normProg(d.data());});return {accounts:accounts,progress:progress};});},
    createStudent:function(o){var id="s_"+rnd(10);return credHash(o.login,o.pass).then(function(h){var acc={name:o.name,login:o.login,loginHash:h,createdAt:Date.now(),note:"",unlocked:[1]};
      return db.doc("accounts/"+id).set(acc).then(function(){return db.doc("logins/"+h).set({account:id,name:o.name,unlocked:[1]});}).then(function(){acc.id=id;return acc;});});},
    resetPassword:function(a,pass){return credHash(a.login,pass).then(function(h){var old=a.loginHash;
      return db.doc("logins/"+h).set({account:a.id,name:a.name,unlocked:a.unlocked}).then(function(){return db.doc("accounts/"+a.id).update({loginHash:h});})
        .then(function(){return old&&old!==h?db.doc("logins/"+old).delete():null;}).then(function(){a.loginHash=h;});});},
    deleteStudent:function(a){return Promise.all([db.doc("accounts/"+a.id).delete(),a.loginHash?db.doc("logins/"+a.loginHash).delete():null,db.doc("progress/"+a.id).delete()]);},
    saveNote:function(a,note){return db.doc("accounts/"+a.id).update({note:note});},
    setUnlocked:function(a,lessons){return db.doc("accounts/"+a.id).update({unlocked:lessons}).then(function(){return a.loginHash?db.doc("logins/"+a.loginHash).update({unlocked:lessons}):null;});},
    changeTeacher:function(login,pass){return credHash(login,pass).then(function(h){return db.doc("config/teacher").set({login:login,hash:h,updatedAt:Date.now()}).then(function(){return {role:"teacher",hash:h,login:login};});});}
  };
}
function RestAPI(){
  var token=null;
  function call(action,body){
    return fetch("/api/app",{method:"POST",headers:Object.assign({"content-type":"application/json"},token?{authorization:"Bearer "+token}:{}),body:JSON.stringify(Object.assign({action:action},body||{}))})
      .catch(function(){throw E("offline");})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(r.status===404)throw E("noapi");if(r.status===401)throw E(j.error==="bad"?"bad":"auth");if(!r.ok)throw E(j.error||"server");return j;});});
  }
  function shape(j){if(j.token)token=j.token;return {role:j.role,token:token,id:j.id,name:j.name||"",login:j.login,unlocked:j.unlocked||[1],progress:j.progress?normProg(j.progress):null};}
  return {
    name:"rest",
    ready:function(){return Promise.resolve(true);},
    login:function(role,login,pass){return call("login",{role:role,login:login,pass:pass}).then(shape);},
    restore:function(s){token=s.token;return call("me").then(shape).catch(function(e){if(e.code==="auth"||e.code==="bad")return null;throw e;});},
    sessionOf:function(r){return {role:r.role,token:r.token,id:r.id,name:r.name,login:r.login};},
    saveProgress:function(s,data){return call("saveProgress",{progress:{xp:data.xp,days:data.days,results:data.results,stats:data.stats}});},
    teacherLoad:function(){return call("teacherLoad").then(function(j){var p={};Object.keys(j.progress||{}).forEach(function(k){p[k]=normProg(j.progress[k]);});return {accounts:j.accounts||[],progress:p};});},
    createStudent:function(o){return call("createStudent",o).then(function(j){return j.account;});},
    resetPassword:function(a,pass){return call("resetPassword",{id:a.id,pass:pass});},
    deleteStudent:function(a){return call("deleteStudent",{id:a.id});},
    saveNote:function(a,note){return call("saveNote",{id:a.id,note:note});},
    setUnlocked:function(a,lessons){return call("setUnlocked",{id:a.id,lessons:lessons});},
    changeTeacher:function(login,pass){return call("changeTeacher",{login:login,pass:pass}).then(shape);}
  };
}
var API=(window.claude&&typeof window.claude.use==="function")?ClaudeAPI():RestAPI();

var S={ready:false,online:false,session:null,data:emptyProg(),unlocked:[1],view:"login",lesson:1,play:null,sync:"",loginTab:"student",loginErr:"",busy:false,lgLogin:""};

var LS_SESSION="slovaklearn-session-v3";
function progKey(){return "slovaklearn-prog-"+(S.session&&S.session.role==="student"?S.session.id:"guest");}
var saveTimer=null;
function save(){
  lsSet(progKey(),S.data);
  if(!(S.session&&S.session.role==="student"))return;
  clearTimeout(saveTimer);S.sync="Зберігаю…";updateSync();
  var sess=S.session;
  saveTimer=setTimeout(function(){
    API.saveProgress(sess,S.data).then(function(){S.sync="Прогрес збережено — лектор бачить ваші результати";updateSync();})
      .catch(function(){S.sync="Не вдалося зберегти на сервері — прогрес лишився на цьому пристрої";updateSync();});
  },500);
}
function tstat(type,v,n){var t=S.data.stats.types[type]||{c:0,n:0};S.data.stats.types[type]={c:t.c+v,n:t.n+(n||1)};}
function record(id,correct,total){
  var pct=total?Math.round(correct/total*100):0;
  var r=S.data.results[id]?Object.assign({},S.data.results[id]):{best:0,tries:0};
  r.best=Math.max(r.best||0,pct);r.last=pct;r.tries=(r.tries||0)+1;r.at=Date.now();
  S.data.results[id]=r;S.data.xp+=Math.round(correct*10);
  var t=today();if(S.data.days.indexOf(t)<0)S.data.days=S.data.days.concat([t]).slice(-90);
  save();return pct;
}
function isOpen(n){return S.unlocked.indexOf(n)>=0;}
function openSets(){return ALL_SETS.filter(function(id){return isOpen(SETS[id].lesson);});}

/* ================= sessions ================= */
function applyStudent(r){
  S.session=API.sessionOf(r);S.unlocked=r.unlocked.slice().sort(function(a,b){return a-b;});
  lsSet(LS_SESSION,S.session);
  var local=normProg(lsGet(progKey()));
  S.data=r.progress?mergeProg(local,r.progress):local;
  S.sync="Прогрес синхронізується з кабінетом лектора";
  go("home");
}
function boot(){
  API.ready().then(function(ok){
    S.ready=true;S.online=ok;
    var sess=lsGet(LS_SESSION);
    if(!sess){render();return;}
    if(sess.role==="guest"){S.session=sess;S.unlocked=ALL_LESSONS.slice();S.data=normProg(lsGet(progKey()));go("home");return;}
    if(!ok){render();return;}
    return API.restore(sess).then(function(r){
      if(!r){lsSet(LS_SESSION,null);S.loginErr=sess.role==="student"?"Ваші дані для входу змінилися. Увійдіть знову.":"";render();return;}
      if(r.role==="teacher"){S.session=API.sessionOf(r);lsSet(LS_SESSION,S.session);go("t-students");}else applyStudent(r);
    });
  }).catch(function(){S.ready=true;render();});
}
function doLogin(form){
  var login=form.querySelector("#lg-login").value.trim(),pass=form.querySelector("#lg-pass").value;S.lgLogin=login;
  if(!login||!pass){S.loginErr="Введіть логін і пароль.";render();return;}
  if(!S.online){S.loginErr="Немає з’єднання із сервером. Спробуйте пізніше або відкрийте вправи без входу.";render();return;}
  S.busy=true;S.loginErr="";render();
  API.login(S.loginTab,login,pass).then(function(r){
    S.busy=false;
    if(r.role==="teacher"){S.session=API.sessionOf(r);lsSet(LS_SESSION,S.session);go("t-students");}else applyStudent(r);
  }).catch(function(e){S.busy=false;
    S.loginErr=e.code==="bad"?(S.loginTab==="teacher"?"Неправильний логін або пароль лектора.":"Неправильний логін або пароль. Перевірте дані, які дав вам лектор."):loginErrText(e.code);render();});
}
function loginErrText(c){
  if(c==="config")return "Сервер не налаштований: у Vercel бракує змінних SESSION_SECRET або DATA_KEY (Settings → Environment Variables), після додавання потрібен Redeploy.";
  if(c==="storage")return "Сервер не бачить сховище даних (Blob). Підключіть Blob-сховище до проєкту у Vercel (Storage) і зробіть Redeploy.";
  if(c==="noapi")return "Серверна частина не знайдена: перевірте, що папка api є в репозиторії.";
  if(c==="offline")return "Немає з’єднання з інтернетом. Спробуйте ще раз.";
  return "Помилка сервера (код: "+(c||"невідомо")+"). Спробуйте ще раз.";
}
function logout(){var wasT=S.session&&S.session.role==="teacher";lsSet(LS_SESSION,null);if(wasT&&routeRole()!=="teacher"){try{location.hash="lektor";}catch(e){}}S.session=null;S.data=emptyProg();S.unlocked=[1];S.play=null;T.loaded=false;T.sel=null;T.creds=null;S.loginErr="";go("login");}

var skVoice=null,voiceChecked=false;
function findVoice(){if(!("speechSynthesis" in window))return null;var vs=window.speechSynthesis.getVoices()||[];
  skVoice=vs.find(function(v){return /^sk/i.test(v.lang);})||vs.find(function(v){return /^cs/i.test(v.lang);})||null;voiceChecked=vs.length>0;return skVoice;}
if("speechSynthesis" in window){findVoice();window.speechSynthesis.onvoiceschanged=function(){findVoice();if(S.view==="play"&&S.play&&S.play.set.type==="listen")render();};}
function speak(text,slow){if(!("speechSynthesis" in window))return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="sk-SK";if(skVoice)u.voice=skVoice;u.rate=slow?0.6:0.85;window.speechSynthesis.speak(u);}catch(e){}}

function viewLesson(){

function loadTeacher(){

function progOf(id){return T.progress[id]||normProg({});}
function summary(acc){
  var p=progOf(acc.id),ids=Object.keys(p.results).filter(function(k){return SETS[k];});
  var avg=ids.length?Math.round(ids.reduce(function(s,k){return s+p.results[k].best;},0)/ids.length):null;
  var done=ids.filter(function(k){return p.results[k].best>=80;}).length;
  var tries=Object.keys(p.results).reduce(function(s,k){return s+(p.results[k].tries||0);},0);
  var openN=ALL_SETS.filter(function(k){return acc.unlocked.indexOf(SETS[k].lesson)>=0;}).length;
  return {p:p,avg:avg,done:done,tries:tries,openN:openN,streak:streakOf(p.days),last:p.updatedAt,inactive:daysSince(p.updatedAt)};
}
function accType(type,p){var t=p.stats.types[type];return t&&t.n>=4?Math.round(t.c/t.n*100):null;}
function advice(account){
  var s=summary(account),p=s.p,out=[],un=account.unlocked;
  if(!s.last){out.push({k:"warn",t:"Ще не виконав жодної вправи. Перевірте, чи отримав учень логін і пароль, і покажіть, як увійти, на найближчому уроці."});return out;}
  if(s.inactive>=7)out.push({k:"bad",t:"Не займався "+s.inactive+" дн. Напишіть коротке нагадування й дайте одну легку вправу (наприклад, картки), щоб повернутися в ритм."});
  else if(s.inactive>=3)out.push({k:"warn",t:"Остання активність "+ago(s.last)+". М’яко нагадайте про щоденні 5 хвилин."});
  var weak=Object.keys(p.results).filter(function(k){return SETS[k]&&p.results[k].best<60;}).sort(function(a,b){return p.results[a].best-p.results[b].best;}).slice(0,3);
  weak.forEach(function(k){var st=SETS[k];out.push({k:"bad",t:"Слабка тема «"+st.title+"» (урок "+st.lesson+") — "+p.results[k].best+" %. Повторіть 5 хвилин на початку уроку, дайте шпаргалку уроку "+st.lesson+" і попросіть пройти вправу ще раз."});});
  var mid=Object.keys(p.results).filter(function(k){return SETS[k]&&p.results[k].best>=60&&p.results[k].best<80;});
  if(mid.length)out.push({k:"warn",t:"Майже засвоєно: "+mid.map(function(k){return "«"+SETS[k].title+"»";}).join(", ")+". Ще одна спроба — і тема закрита."});
  if(p.stats.dia>=3)out.push({k:"warn",t:"Часто пропускає діакритику ("+p.stats.dia+" раз, за такі відповіді — 0,5 бала). Наголосіть на довгих голосних і м’яких приголосних; давайте більше вправ на письмо."});
  var aL=accType("listen",p),aC=accType("choice",p),aT=accType("type",p);
  if(aL!==null&&aL<70)out.push({k:"warn",t:"Аудіювання — "+aL+" %. Додайте 2–3 хвилини диктанту чисел на кожному уроці."});
  if(aC!==null&&aT!==null&&aC-aT>=20)out.push({k:"info",t:"Впізнає правильну форму ("+aC+" %), але гірше пише сам ("+aT+" %). Більше завдань на письмо, менше тестів з вибором."});
  var untouched=un.filter(function(n){return LESSONS[n-1].sets.every(function(st){return !p.results[st.id];});});
  if(untouched.length)out.push({k:"info",t:"Ще не відкривав вправи до "+(untouched.length>1?"уроків ":"уроку ")+untouched.join(", ")+" (вони вже доступні)."});
  var allOpenDone=un.every(function(n){return LESSONS[n-1].sets.every(function(st){return p.results[st.id]&&p.results[st.id].best>=80;});});
  var nextL=ALL_LESSONS.find(function(n){return un.indexOf(n)<0;});
  if(allOpenDone&&nextL)out.push({k:"good",t:"Усі відкриті вправи пройдено на 80 %+. Після уроку "+nextL+" відкрийте учню вправи до нього."});
  if(s.streak>=5)out.push({k:"good",t:s.streak+" днів поспіль — похваліть учня на уроці."});
  if(!out.length)out.push({k:"good",t:"Все йде добре: регулярні заняття й стабільні результати."});
  return out;
}
function statusPill(account){var a=advice(account),s=summary(account);

  return '<span class="pill done">ДОБРЕ</span>';}

/* ================= teacher: actions ================= */
function tfail(e,msg){if(e&&e.code==="auth"){logout();return;}T.msgErr=true;T.msg=msg;S.busy=false;render();}
function createStudent(form){
  var name=form.querySelector("#nw-name").value.trim(),login=form.querySelector("#nw-login").value.trim().toLowerCase(),pass=form.querySelector("#nw-pass").value.trim();
  T.newName=name;T.newLogin=login;T.newPass=pass;T.msg="";
  if(!name){T.msg="Введіть ім’я учня.";render();return;}
  if(!login)login=genLogin(name);
  if(!/^[a-z0-9._-]{3,30}$/.test(login)){T.msg="Логін: 3–30 символів, лише латинські літери, цифри, крапка, дефіс.";render();return;}
  if(login==="lektor"||T.accounts.some(function(a){return a.login===login;})){T.msg="Такий логін уже є. Виберіть інший.";T.newLogin=login+Math.floor(Math.random()*9+1);render();return;}
  if(pass.length<6){T.msg="Пароль має бути щонайменше 6 символів.";render();return;}
  S.busy=true;render();
  API.createStudent({name:name,login:login,pass:pass}).then(function(acc){
    if(!acc.unlocked)acc.unlocked=[1];T.accounts.push(acc);T.creds={name:name,login:login,pass:pass};T.newName="";T.newLogin="";T.newPass=genPass();T.autoLogin=true;S.busy=false;render();
  }).catch(function(e){tfail(e,e&&e.code==="exists"?"Такий логін уже є. Виберіть інший.":"Не вдалося створити обліковий запис. Спробуйте ще раз.");});
}
function resetPass(a){var pass=genPass();API.resetPassword(a,pass).then(function(){T.creds={name:a.name,login:a.login,pass:pass,reset:true};T.msg="";render();window.scrollTo(0,0);}).catch(function(e){tfail(e,"Не вдалося змінити пароль.");});}
function deleteStudent(a){API.deleteStudent(a).then(function(){T.accounts=T.accounts.filter(function(x){return x.id!==a.id;});delete T.progress[a.id];T.confirm=null;T.msgErr=false;T.msg="Обліковий запис «"+a.name+"» видалено.";go("t-students");}).catch(function(e){tfail(e,"Не вдалося видалити.");});}
function saveNote(a,form){var note=form.querySelector("#nt-text").value;API.saveNote(a,note).then(function(){a.note=note;T.msgErr=false;T.msg="Poznámka uložená.";render();}).catch(function(e){tfail(e,"Не вдалося зберегти нотатку.");});}
function toggleLesson(a,n){
  var next=a.unlocked.indexOf(n)>=0?a.unlocked.filter(function(x){return x!==n;}):a.unlocked.concat([n]);next.sort(function(x,y){return x-y;});
  var prev=a.unlocked;a.unlocked=next;T.msg="";render();
  API.setUnlocked(a,next).catch(function(e){a.unlocked=prev;tfail(e,"Не вдалося змінити доступ.");});
}
function unlockAll(n){
  var list=T.accounts.filter(function(a){return a.unlocked.indexOf(n)<0;});
  Promise.all(list.map(function(a){var nx=a.unlocked.concat([n]).sort(function(x,y){return x-y;});return API.setUnlocked(a,nx).then(function(){a.unlocked=nx;});}))
    .then(function(){T.msgErr=false;T.msg="Урок "+n+" відкрито для всіх учнів ("+list.length+").";render();}).catch(function(e){tfail(e,"Не вдалося відкрити урок для всіх. Оновіть сторінку й спробуйте ще раз.");});
}
function saveTeacherCreds(form){
  var login=form.querySelector("#tp-login").value.trim().toLowerCase(),p1=form.querySelector("#tp-pass").value,p2=form.querySelector("#tp-pass2").value;
  T.msgErr=true;
  if(!/^[a-z0-9._-]{3,30}$/.test(login)){T.msg="Логін: 3–30 латинських символів.";render();return;}
  if(p1.length<8){T.msg="Пароль має бути щонайменше 8 символів.";render();return;}
  if(p1!==p2){T.msg="Паролі не збігаються.";render();return;}
  API.changeTeacher(login,p1).then(function(r){S.session=API.sessionOf(r);lsSet(LS_SESSION,S.session);T.msgErr=false;T.msg="Дані лектора змінено. Використовуйте новий пароль під час наступного входу.";render();}).catch(function(e){tfail(e,"Не вдалося зберегти.");});
}

/* ================= render & events ================= */
function render(){
  renderNav();
  var v=S.view,h="";
  if(!S.session&&v!=="login")v=S.view="login";
  if(v==="login")h=viewLogin();
  else if(v==="home")h=viewHome();
  else if(v==="lesson")h=viewLesson();
  else if(v==="play")h=viewPlay();
  else if(v==="result")h=viewResult();
  else if(v==="t-materials")h=viewTMaterials();
  else if(v==="t-students")h=viewTStudents();
  else if(v==="t-new")h=viewTNew();
  else if(v==="t-student")h=viewTStudent();
  else if(v==="t-settings")h=viewTSettings();
  app.innerHTML=h;
}
app.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="loginform")return doLogin(f);
  if(f.id==="newform")return createStudent(f);
  if(f.id==="noteform"){var a=T.accounts.find(function(x){return x.id===T.sel;});if(a)saveNote(a,f);return;}
  if(f.id==="tpassform")return saveTeacherCreds(f);
});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled||b.type==="submit")return;
  var P=S.play,a;
  if(b.hasAttribute("data-tostudent")){S.loginErr="";S.lgLogin="";if(location.pathname.replace(/\/+$/,"")==="/lektor"){location.href="/";return;}try{history.replaceState(null,"",location.pathname+location.search);}catch(e){location.hash="";}return render();}
  if(b.hasAttribute("data-guest")){S.session={role:"guest",name:""};S.unlocked=ALL_LESSONS.slice();lsSet(LS_SESSION,S.session);S.data=normProg(lsGet(progKey()));return go("home");}
  if(b.hasAttribute("data-start"))return start(b.getAttribute("data-start"));
  if(b.hasAttribute("data-lesson"))return go("lesson",{lesson:+b.getAttribute("data-lesson")});
  if(b.hasAttribute("data-home"))return go("home");
  if(b.hasAttribute("data-quit"))return go(P&&P.set.lesson?"lesson":"home",P&&P.set.lesson?{lesson:P.set.lesson}:null);
  if(b.hasAttribute("data-next"))return next();
  if(b.hasAttribute("data-opt")){var o=b.getAttribute("data-opt");return answer(o===cur().it.a?1:0,o);}
  if(b.hasAttribute("data-check"))return checkTyped();
  if(b.hasAttribute("data-key")){var el=document.getElementById("ans");if(el){var s=el.selectionStart==null?el.value.length:el.selectionStart,en=el.selectionEnd==null?s:el.selectionEnd;el.value=el.value.slice(0,s)+b.getAttribute("data-key")+el.value.slice(en);P.input=el.value;el.focus();el.setSelectionRange(s+1,s+1);}return;}
  if(b.hasAttribute("data-say")||b.hasAttribute("data-say-slow"))return speak(cur().it.say,b.hasAttribute("data-say-slow"));
  if(b.hasAttribute("data-pick")){var c=cur();c.picked.push(c.pool.splice(+b.getAttribute("data-pick"),1)[0]);return render();}
  if(b.hasAttribute("data-unpick")){var c2=cur();c2.pool.push(c2.picked.splice(+b.getAttribute("data-unpick"),1)[0]);return render();}
  if(b.hasAttribute("data-check-order")){var c3=cur(),ok=norm(c3.picked.map(function(x){return x.w;}).join(" "))===norm(c3.it.a);return answer(ok?1:0,ok?"ok":"no");}
  if(b.hasAttribute("data-ml")){P.sel=+b.getAttribute("data-ml");P.flash=null;return render();}
  if(b.hasAttribute("data-mr")){if(P.sel===null)return;var k=+b.getAttribute("data-mr");
    if(k===P.sel){P.done[k]=true;P.matched++;P.sel=null;P.flash=null;render();if(P.matched===P.pairs.length)setTimeout(finish,500);}
    else{P.mistakes++;P.flash=k;render();setTimeout(function(){if(S.play===P&&P.flash===k){P.flash=null;render();}},700);}return;}
  if(b.hasAttribute("data-flip")){P.flipped=true;return render();}
  if(b.hasAttribute("data-say-card"))return speak(P.items[P.i].sk);
  if(b.hasAttribute("data-know")){if(b.getAttribute("data-know")==="1")P.known++;else P.wrong.push({it:{ua:P.items[P.i].sk,a:P.items[P.i].ua}});if(P.i+1>=P.items.length)return finish();P.i++;P.flipped=false;return render();}
  if(b.hasAttribute("data-reload")){T.loaded=false;T.msg="";render();return loadTeacher();}
  if(b.hasAttribute("data-tnew")){T.creds=null;T.msg="";return go("t-new");}
  if(b.hasAttribute("data-nav2")){T.creds=null;T.confirm=null;T.msg="";return go(b.getAttribute("data-nav2"));}
  if(b.hasAttribute("data-tstudent")){T.sel=b.getAttribute("data-tstudent");T.creds=null;T.confirm=null;T.msg="";return go("t-student");}
  if(b.hasAttribute("data-regen")){var pi=document.getElementById("nw-pass");T.newPass=genPass();if(pi)pi.value=T.newPass;return;}
  if(b.hasAttribute("data-copy"))return copy(b.getAttribute("data-copy"),b);
  if(b.hasAttribute("data-closecreds")){var wasNew=S.view==="t-new";T.creds=null;return wasNew?go("t-students"):render();}
  if(b.hasAttribute("data-unlockall"))return unlockAll(+b.getAttribute("data-unlockall"));
  a=T.accounts.find(function(x){return x.id===T.sel;});
  if(b.hasAttribute("data-toggle")&&a)return toggleLesson(a,+b.getAttribute("data-toggle"));
  if(b.hasAttribute("data-reset")&&a)return resetPass(a);
  if(b.hasAttribute("data-askdel")){T.confirm="del";return render();}
  if(b.hasAttribute("data-canceldel")){T.confirm=null;return render();}
  if(b.hasAttribute("data-del")&&a)return deleteStudent(a);
});

  light:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>'};
var theme=lsGet("slovaklearn-theme");if(THEMES.indexOf(theme)<0)theme=null;
function applyTheme(){var root=document.documentElement;if(theme)root.setAttribute("data-theme",theme);else root.removeAttribute("data-theme");
  var k=theme||"auto",btn=document.getElementById("theme");btn.innerHTML=ICON_T[k]+'<span>'+THEME_LABEL[k]+'</span>';btn.setAttribute("aria-label","Téma: "+THEME_LABEL[k]+" — змінити тему");}
document.getElementById("theme").addEventListener("click",function(){theme=THEMES[(THEMES.indexOf(theme)+1)%3];lsSet("slovaklearn-theme",theme);applyTheme();});
window.addEventListener("hashchange",function(){if(!S.session){S.loginErr="";render();}});
applyTheme();
render();
boot();
})();
</script>
