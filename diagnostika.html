<style>

  --font:'Montserrat','Segoe UI',Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1630; --surface:#13234B; --ink:#E8EEFB; --muted:#A9B8DB; --line:#2A3D6E; --soft:#1C3066;
  --hdr:#07122B; --navy:#C9D7FA; --blue:#8FB0EE; --btn:#3D63D9; --good:#7AD9A2; --good-bg:#123B2A; --weak:#F5B58C; --weak-bg:#43261A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1630; --surface:#13234B; --ink:#E8EEFB; --muted:#A9B8DB; --line:#2A3D6E; --soft:#1C3066;
  --hdr:#07122B; --navy:#C9D7FA; --blue:#8FB0EE; --btn:#3D63D9; --good:#7AD9A2; --good-bg:#123B2A; --weak:#F5B58C; --weak-bg:#43261A; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{max-width:100%;height:auto}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bar{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff}
.bar .wrap{max-width:1080px;display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:40px;height:40px}
.brand b{font-size:15px;letter-spacing:1.2px}
.bar nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.bar nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px}
.bar nav a:hover{background:rgba(255,255,255,.1)}
@media (max-width:560px){.bar nav a.hide-sm{display:none}}
.themebtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;font-weight:700;font-size:13px;padding:6px 10px;min-height:38px;cursor:pointer}
.themebtn:hover{border-color:var(--accent)}
.themebtn .ico{width:18px;height:18px}
@media (max-width:520px){.themebtn span{display:none}}

main{flex:1;padding-block:32px 56px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btn-ink);font-weight:800;text-decoration:none;padding:13px 22px;border:0;cursor:pointer;min-height:48px}
.btn:hover{box-shadow:0 0 0 3px var(--soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.yellow{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 0}

/* intro */
.hero{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.hero .txt{flex:999 1 340px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:800;color:var(--navy)}
.hero img{width:150px;margin-left:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.facts li{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.facts b{color:var(--navy);font-size:16px}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);color:var(--ink);padding:13px 16px;cursor:pointer;min-height:52px;font-weight:600}
.choice:hover{border-color:var(--blue)}
.choice .k{flex:none;width:28px;height:28px;display:grid;place-items:center;background:var(--soft);color:var(--navy);font-weight:800;font-size:14px}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--soft)}
.choice[aria-pressed="true"] .k{background:var(--blue);color:#fff}

/* question */
.prog{display:flex;flex-direction:column;gap:8px}
.prog .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg{height:8px;background:var(--line);position:relative;overflow:hidden}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.seg.ok i{background:var(--good);width:100%}
.qtag{display:inline-block;align-self:flex-start;background:var(--soft);color:var(--navy);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px}
.qtask{font-size:15px;color:var(--muted)}
.qtext{font-size:22px;font-weight:700;color:var(--navy);line-height:1.35}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);margin:0 4px}
.reading{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--blue);padding:16px 18px;font-size:16px;line-height:1.65;white-space:pre-line}
.audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.audio .btn{min-height:52px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* result */
.res-hero{background:var(--hdr);color:#fff;padding:26px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.res-hero .txt{flex:999 1 300px;display:flex;flex-direction:column;gap:8px}
.res-hero .eyebrow{color:var(--accent)}
.res-hero h1{font-size:clamp(24px,4.4vw,34px);font-weight:800}
.res-hero p{color:#DCE6FA}
.res-hero img{width:110px;margin-left:auto}
.mods{display:flex;flex-direction:column;gap:10px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mod .nm{font-weight:700;color:var(--navy)}
.mod .nm span{font-weight:500;color:var(--muted)}
.mod .sc{font-weight:800;font-variant-numeric:tabular-nums}
.mod .meter{grid-column:1/-1;height:10px;background:var(--line);position:relative}
.mod .meter i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.mod.pass .meter i{background:var(--good)}
.mod.fail .meter i{background:var(--weak)}
.mod.skip{opacity:.6}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;margin-left:6px;vertical-align:middle}
.pill.pass{background:var(--good-bg);color:var(--good)}
.pill.fail{background:var(--weak-bg);color:var(--weak)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.skill{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.skill b{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.skill span{font-size:14px;color:var(--muted)}
.next{border:2px solid var(--accent);background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:12px}
.next h2{font-size:20px;color:var(--navy)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);padding:12px;white-space:pre-wrap;word-break:break-word}
.h2{font-size:20px;font-weight:800;color:var(--navy)}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
footer{padding-block:20px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;max-width:1080px}
</style>
</head>

var app = document.getElementById("app");
var st = load() || fresh();
function fresh(){ return {step:"intro", self:null, block:0, idx:0, ans:{}, ord:{}, sel:null, show:{}, date:null}; }
function load(){ try{ var s = JSON.parse(localStorage.getItem(LS)); return s && s.step ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(st)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffled(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); for(var j=n-1;j>0;j--){ var r=Math.floor(Math.random()*(j+1)), t=a[j]; a[j]=a[r]; a[r]=t; } return a; }
function go(step){ st.step = step; save(); render(); window.scrollTo(0,0); }

/* ---------- speech ---------- */
var voice = null;
function pickVoice(){ if(!("speechSynthesis" in window)) return; var vs = speechSynthesis.getVoices() || [];
  voice = vs.find(function(v){ return /^sk/i.test(v.lang); }) || vs.find(function(v){ return /^cs/i.test(v.lang); }) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){ if(!("speechSynthesis" in window)) return; try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = "sk-SK"; if(voice) u.voice = voice; u.rate = slow ? 0.6 : 0.85; speechSynthesis.speak(u); }catch(e){} }

/* ---------- scoring ---------- */
function blockScore(b){ var c = 0, n = 0; BANK[b].forEach(function(it){ var a = st.ans[it.id]; if(a){ n++; if(a.ok) c++; } }); return {c:c, n:n}; }
function outcome(){
  var mods = [], stop = null;
  for(var b=0; b<5; b++){
    var s = blockScore(b);
    if(s.n < 8){ mods.push({b:b, c:s.c, n:s.n, state:"skip"}); continue; }
    var pass = s.c >= PASS;
    mods.push({b:b, c:s.c, n:s.n, state: pass ? "pass" : "fail"});
    if(!pass && stop === null) stop = b;
  }
  var wrong = [];
  for(var k in st.ans){ if(!st.ans[k].ok) wrong.push(st.ans[k].L); }
  wrong = wrong.filter(function(x,i){ return wrong.indexOf(x) === i; }).sort(function(a,b){ return a-b; });
  var start, a2 = false, early = null;
  mods.forEach(function(x){ if(x.state === "skip" && early === null) early = x.b; });
  if(stop === null && early === null){ a2 = true; start = null; }
  else if(stop === null){ stop = early; start = MODS[early].from; }
  else {
    var m = MODS[stop], s2 = blockScore(stop);
    var inMod = wrong.filter(function(l){ return l >= m.from && l < m.from + 6; });
    start = (stop === 0 && s2.c <= 3) ? 1 : (inMod.length ? inMod[0] : m.from);
  }
  var sk = {}; Object.keys(SKILL).forEach(function(k){ sk[k] = {c:0, n:0}; });
  BANK.forEach(function(bl){ bl.forEach(function(it){ var a = st.ans[it.id]; if(!a) return; var k = (it.k === "l" && a.noaudio) ? "r" : it.k; sk[k].n++; if(a.ok) sk[k].c++; }); });
  return {mods:mods, stop:stop, start:start, a2:a2, wrong:wrong, skills:sk};
}

/* ---------- views ---------- */
function vIntro(){
  return '<div class="stack">' +
  '<div class="hero"><div class="txt"><span class="eyebrow">Безкоштовно · без реєстрації</span>' +
  '<h1>Тест рівня словацької A1</h1>' +
  '<p class="muted" style="font-size:18px">За 15–20 хвилин дізнаєтеся, які теми рівня A1 ви вже знаєте і з якого уроку курсу вам варто почати.</p></div>' +
  '<img src="img/think.webp" alt="" width="150" height="150"></div>' +
  '<ul class="facts">' +
  '<li><b>5 блоків</b><span class="muted">по одному на кожен модуль курсу A1</span></li>' +
  '<li><b>Від простого до складного</b><span class="muted">тест зупиниться там, де теми ще нові</span></li>' +
  '<li><b>Граматика, лексика, читання, слухання</b><span class="muted">увімкніть звук</span></li></ul>' +
  '<div class="card"><p>Не підглядайте у словник і не вгадуйте навмання: якщо не знаєте відповіді, оберіть найімовірнішу. Так рекомендація буде точною.</p>' +
  '<div class="row">' + '<button class="btn" data-act="self">Почати тест</button>' + '</div></div>' +
  '</div>';
}
function vSelf(){
  var opts = [["zero","Ніколи не вчив(ла) словацьку"],["some","Знаю окремі слова й фрази"],["talk","Можу трохи спілкуватися"]];
  return '<div class="card"><span class="eyebrow">Перед тестом</span><h2 class="h2">Чи вчили ви словацьку раніше?</h2><div class="choices">' +
    opts.map(function(o,i){ return '<button class="choice" data-self="'+o[0]+'"><span class="k">'+(i+1)+'</span><span>'+o[1]+'</span></button>'; }).join("") + '</div></div>';
}
function vZero(){
  return '<div class="stack"><div class="res-hero"><div class="txt"><span class="eyebrow">Рекомендований старт</span><h1>Урок 1 · Pozdravy a zoznámenie</h1>' +
    '<p>Курс A1 побудований саме для тих, хто починає з нуля: перші уроки з вітань, знайомства й чисел.</p></div><img src="img/wave.webp" alt="" width="110" height="110"></div>' +
    nextBox(null) +
    '<div class="card"><p>Трохи знаєте мову, хоч і не вчили її на курсах? Пройдіть тест, він займе кілька хвилин.</p><div class="row"><button class="btn ghost" data-act="begin">Все одно пройти тест</button></div></div></div>';
}
function curItem(){ return BANK[st.block][st.idx]; }
function vQ(){
  var it = curItem(), ord = st.ord[it.id] || (st.ord[it.id] = shuffled(it.o.length));
  var num = st.block * 8 + st.idx + 1;
  var segs = '<div class="segs" aria-hidden="true">' + MODS.map(function(m,b){
    var w = b < st.block ? 100 : (b === st.block ? Math.round(st.idx / 8 * 100) : 0);
    return '<span class="seg' + (b < st.block ? ' ok' : '') + '"><i style="width:' + w + '%"></i></span>'; }).join("") + '</div>';
  var h = '<div class="stack"><div class="prog"><div class="top"><span>Модуль ' + (st.block+1) + ' з 5 · ' + MODS[st.block].title + '</span><span>Питання ' + (st.idx+1) + ' / 8</span></div>' + segs + '</div>';
  h += '<div class="card"><span class="qtag">' + SKILL[it.k] + '</span>';
  if(it.k === "g") h += '<p class="qtask">Оберіть правильний варіант.</p><p class="qtext">' + esc(it.q).replace("___", '<span class="gap" aria-label="пропуск"></span>') + '</p>';
  else if(it.k === "v") h += '<p class="qtext" style="font-size:19px">' + esc(it.task) + '</p>';
  else if(it.k === "r") h += '<p class="qtask">Прочитайте текст і дайте відповідь.</p><div class="reading" lang="sk">' + esc(TEXTS[it.t]) + '</div><p class="qtext" style="font-size:19px">' + esc(it.q) + '</p>';
  else {
    var shown = st.show[it.id];
    h += '<p class="qtask">Прослухайте запис (можна кілька разів) і дайте відповідь.</p><div class="audio"><button class="btn" data-say="0">▶ Прослухати</button><button class="btn ghost" data-say="1">Повільніше</button></div>';
    if(shown) h += '<div class="reading" lang="sk">' + esc(it.say) + '</div>';
    else h += '<button class="linkbtn" data-act="showtext" style="align-self:flex-start">Не працює звук? Показати текст</button>';
    h += '<p class="qtext" style="font-size:19px">' + esc(it.q) + '</p>';
  }
  h += '<div class="choices" role="group" aria-label="Варіанти відповіді" lang="sk">' + ord.map(function(oi, i){
    return '<button class="choice" data-opt="' + oi + '" aria-pressed="' + (st.sel === oi ? "true" : "false") + '"><span class="k">' + "ABCD"[i] + '</span><span>' + esc(it.o[oi]) + '</span></button>'; }).join("") + '</div>';
  h += '<div class="foot"><span class="muted" style="font-size:14px">' + num + ' з 40 максимум</span><button class="btn" data-act="next"' + (st.sel === null ? " disabled" : "") + '>' + (st.idx === 7 ? "Завершити блок" : "Далі") + '</button></div></div></div>';
  return h;
}
function vBlock(){
  var s = blockScore(st.block), m = MODS[st.block + 1];
  return '<div class="card" style="align-items:flex-start"><img src="img/party.webp" alt="" width="110" height="110"><span class="eyebrow">Модуль ' + (st.block+1) + ' · ' + MODS[st.block].title + '</span>' +
    '<h2 class="h2">Чудово, цей блок ви знаєте!</h2><p class="muted">Правильних відповідей: ' + s.c + ' з 8. Далі теми модуля ' + m.n + ' «' + m.title + '» (' + m.ua.toLowerCase() + ').</p>' +
    '<div class="row"><button class="btn" data-act="nextblock">Далі: модуль ' + m.n + '</button><button class="linkbtn" data-act="finish">Завершити й побачити результат</button></div></div>';
}
function pct(x){ return x.n ? Math.round(x.c / x.n * 100) : null; }
function resultText(o){
  var d = new Date(st.date || Date.now());
  var lines = ["Slovak Learn · Diagnostika A1 · " + d.toLocaleDateString("sk-SK")];
  lines.push(o.a2 ? "Odporúčanie: A1 zvládnuté → A2" : "Odporúčaný štart: lekcia " + o.start + " (" + LESSON[o.start] + ")");
  lines.push("Moduly: " + o.mods.filter(function(m){ return m.state !== "skip"; }).map(function(m){ return "M" + (m.b+1) + " " + m.c + "/8"; }).join(" · "));
  var sk = []; Object.keys(SKILL).forEach(function(k){ var p = pct(o.skills[k]); if(p !== null) sk.push({g:"gramatika",v:"slovná zásoba",r:"čítanie",l:"počúvanie"}[k] + " " + p + " %"); });
  lines.push("Zručnosti: " + sk.join(" · "));
  if(o.wrong.length) lines.push("Chyby v lekciách: " + o.wrong.join(", "));
  lines.push("Samohodnotenie: " + ({zero:"začiatočník", some:"pozná slová a frázy", talk:"trochu komunikuje"}[st.self] || "—"));
  return lines.join("\n");
}
function nextBox(o){
  return '<div class="next"><h2>Наступний крок: розмова з лектором</h2>' +
    '<p>Онлайн-тест не перевіряє говоріння. На безкоштовній 30-хвилинній діагностиці лектор поговорить з вами словацькою, уточнить стартовий урок і складе план під вашу мету: робота, навчання чи побут.</p>' +
    (o ? '<p class="muted" style="font-size:14px">Скопіюйте результат і надішліть його нам у повідомленні, щоб лектор підготувався до розмови.</p><div class="code" id="code">' + esc(resultText(o)) + '</div>' : '') +
    '<div class="row"><a class="btn yellow" href="' + ZAPYS_URL + '" target="_blank" rel="noopener">Записатися на діагностику</a>' +
    (o ? '<button class="btn ghost" data-act="copy">Скопіювати результат</button>' : '') + '<a class="linkbtn" href="/tarify">Тарифи</a></div></div>';
}
function vResult(){
  var o = outcome(), h = '<div class="stack">';
  if(o.a2){
    h += '<div class="res-hero"><div class="txt"><span class="eyebrow">Ваш результат</span><h1>Рівень A1 ви знаєте впевнено</h1><p>Рекомендуємо переходити до рівня A2. ' + (o.wrong.length ? 'Перед цим варто коротко повторити теми, де були помилки.' : 'Помилок майже немає, чудова робота!') + '</p></div><img src="img/party.webp" alt="" width="110" height="110"></div>';
  } else {
    var m = MODS[o.stop], known = o.stop > 0 ? (o.stop === 1 ? "Теми модуля 1 ви вже знаєте." : "Теми модулів 1–" + o.stop + " ви вже знаєте.") : (o.start === 1 ? "Найкраще почати курс з самого початку." : "Основи ви знаєте, але частину тем модуля 1 варто пройти.");
    h += '<div class="res-hero"><div class="txt"><span class="eyebrow">Рекомендований старт</span><h1>Урок ' + o.start + ' · ' + LESSON[o.start] + '</h1><p>Модуль ' + m.n + ' · ' + m.title + ' (' + m.ua.toLowerCase() + '). ' + known + '</p></div><img src="img/wave.webp" alt="" width="110" height="110"></div>';
  }
  h += '<div class="card"><h2 class="h2">Результати за модулями</h2><div class="mods">' + o.mods.map(function(x){
    var md = MODS[x.b], w = x.state === "skip" ? 0 : Math.round(x.c / 8 * 100);
    var tag = x.state === "pass" ? '<span class="pill pass">знаєте</span>' : (x.state === "fail" ? '<span class="pill fail">варто пройти</span>' : '');
    return '<div class="mod ' + x.state + '"><span class="nm">' + md.n + '. ' + md.title + ' <span>· уроки ' + md.from + '–' + (md.from+5) + '</span>' + tag + '</span><span class="sc">' + (x.state === "skip" ? "—" : x.c + " / 8") + '</span><span class="meter" aria-hidden="true"><i style="width:' + w + '%"></i></span></div>'; }).join("") +
    '</div>' + (o.stop !== null && o.mods[o.stop].state === "skip" ? '<p class="muted" style="font-size:14px">Ви завершили тест достроково, тож модулі від ' + (o.stop+1) + '-го не перевірялися. Лектор уточнить це на розмові.</p>' : (o.stop !== null && o.stop < 4 ? '<p class="muted" style="font-size:14px">Блоки після модуля ' + (o.stop+1) + ' не показувались: теми там будуються на попередніх.</p>' : '')) + '</div>';
  h += '<div class="card"><h2 class="h2">Ваші навички</h2><div class="skills">' + Object.keys(SKILL).map(function(k){
    var p = pct(o.skills[k]); return '<div class="skill"><b>' + (p === null ? "—" : p + " %") + '</b><span>' + SKILL[k] + '</span></div>'; }).join("") + '</div>';
  if(o.wrong.length) h += '<p class="muted" style="font-size:14px">Помилки були в темах: ' + o.wrong.map(function(l){ return l + " " + LESSON[l]; }).join(" · ") + '.</p>';
  h += '</div>';
  h += nextBox(o);
  h += '<div class="row"><button class="linkbtn" data-act="restart">Пройти тест ще раз</button></div></div>';
  return h;
}
function render(){
  var v = {intro:vIntro, self:vSelf, zero:vZero, q:vQ, block:vBlock, result:vResult}[st.step] || vIntro;
  app.innerHTML = v();
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-self")){ st.self = b.getAttribute("data-self"); if(st.self === "zero") return go("zero"); return begin(); }
  if(b.hasAttribute("data-opt")){ st.sel = +b.getAttribute("data-opt"); save(); render(); var nx = app.querySelector('[data-act="next"]'); if(nx) nx.focus({preventScroll:true}); return; }
  if(b.hasAttribute("data-say")){ speak(curItem().say, b.getAttribute("data-say") === "1"); return; }
  var a = b.getAttribute("data-act");
  if(a === "self") return go("self");
  if(a === "begin") return begin();
  if(a === "restart"){ st = fresh(); save(); return go("intro"); }
  if(a === "showtext"){ st.show[curItem().id] = true; save(); return render(); }
  if(a === "next") return answer();
  if(a === "nextblock"){ st.block++; st.idx = 0; st.sel = null; return go("q"); }
  if(a === "finish") return finish();
  if(a === "copy"){ var t = resultText(outcome()); copyText(t, b); return; }
});
function begin(){ st.block = 0; st.idx = 0; st.ans = {}; st.ord = {}; st.show = {}; st.sel = null; st.date = null; go("q"); }
function answer(){
  var it = curItem(); if(st.sel === null) return;
  st.ans[it.id] = {ok: st.sel === 0, L: it.L, noaudio: !!st.show[it.id]};
  st.sel = null;
  if(st.idx < 7){ st.idx++; return go("q"); }
  var s = blockScore(st.block);
  if(s.c >= PASS && st.block < 4) return go("block");
  finish();
}
function finish(){ st.date = Date.now(); go("result"); }
function copyText(t, btn){
  function done(){ btn.textContent = "Скопійовано ✓"; setTimeout(function(){ btn.textContent = "Скопіювати результат"; }, 2000); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, fallback); } else fallback();
  function fallback(){ var r = document.createRange(), el = document.getElementById("code"); if(!el) return; r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); try{ document.execCommand("copy"); done(); }catch(e){} }
}
document.addEventListener("keydown", function(e){
  if(st.step !== "q" || e.target.closest && e.target.closest("input,textarea")) return;
  var i = "1234abcd".indexOf(e.key.toLowerCase()); if(i < 0){ if(e.key === "Enter" && st.sel !== null && !(e.target.closest && e.target.closest("button"))) answer(); return; }
  var btns = app.querySelectorAll("[data-opt]"); var bt = btns[i % 4]; if(bt) bt.click();
});
render();

/* Theme toggle, shared with the platform via the same storage key. */
(function(){
  var KEY="slovaklearn-theme", THEMES=[null,"light","dark"], LABEL={auto:"Auto",light:"Svetlá",dark:"Tmavá"};
  var ICON={auto:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    light:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>'};
  var theme=null; try{theme=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(THEMES.indexOf(theme)<0) theme=null;
  var btn=document.getElementById("theme");
  function apply(){
    var root=document.documentElement;
    if(theme) root.setAttribute("data-theme",theme); else root.removeAttribute("data-theme");
    var k=theme||"auto"; btn.innerHTML=ICON[k]+"<span>"+LABEL[k]+"</span>";
    btn.setAttribute("aria-label","Тема: "+LABEL[k]+" — змінити тему");
  }
  btn.addEventListener("click",function(){
    theme=THEMES[(THEMES.indexOf(theme)+1)%3];
    try{ if(theme) localStorage.setItem(KEY,JSON.stringify(theme)); else localStorage.removeItem(KEY); }catch(e){}
    apply();
  });
  apply();
})();
</script>
